<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Mixer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="main">
    <header class="target">
      <div class="controls">
        <div class="entry-row">
          <div class="target-swatch" id="targetSwatch"></div>
          <div class="target-entry">
            <label for="hex">Hex colour</label>
            <div class="hex-row">
              <input id="hex" type="text" spellcheck="false" autocomplete="off" maxlength="9" placeholder="#6B8E4E">
              <button class="dropper" id="dropper" type="button" title="Pick a colour from anywhere on your screen">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 7l3 3M4 20l1-4 9-9 3 3-9 9-4 1zM13 5l1.5-1.5a2.5 2.5 0 0 1 3.5 0l2 2a2.5 2.5 0 0 1 0 3.5L18.5 11"/></svg>
                Eyedropper
              </button>
            </div>
          </div>
          <div class="batch">
            <label for="batch">Batch size</label>
            <div class="batch-field"><input id="batch" type="number" min="1" max="5000" value="30"><span>ml</span></div>
          </div>
        </div>
        <p class="error" id="error" role="alert"></p>
        <div class="sliders">
          <label for="hue">Hue</label><input id="hue" type="range" min="0" max="360" step="1"><output id="hueVal"></output>
          <label for="sat">Saturation</label><input id="sat" type="range" min="0" max="100" step="1"><output id="satVal"></output>
          <label for="bri">Brightness</label><input id="bri" type="range" min="0" max="100" step="1"><output id="briVal"></output>
        </div>
      </div>
      <div class="wheel-wrap">
        <canvas id="wheel" width="360" height="360" role="img" aria-label="Colour wheel. Drag to choose hue and saturation; the sliders offer the same choices by keyboard."></canvas>
        <div class="wheel-dot" id="wheelDot"></div>
      </div>
    </header>
    <p class="note" id="note" hidden></p>
    <section class="recipes" id="recipes" aria-live="polite"></section>
    <footer class="caveat">
      Proportions are by volume. They come from a model of typical pigments, and brands differ,
      so treat each recipe as a starting point: mix, test a swatch, then adjust by eye.
      Acrylics usually dry a little darker than they look wet.
    </footer>
  </main>
  <aside class="palette">
    <div class="palette-head">
      <h2>Your paints</h2>
      <span id="paintCount"></span>
    </div>
    <div class="presets" id="presets"></div>
    <ul class="paint-list" id="paintList"></ul>
  </aside>
</div>
<script src="js/paints.js"></script>
<script src="js/mixer.js"></script>
<script src="js/picker.js"></script>
<script src="js/app.js"></script>
</body>
</html>
